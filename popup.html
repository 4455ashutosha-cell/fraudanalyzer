<!DOCTYPE html><html><head><meta charset='utf-8'><script src='https://cdn.tailwindcss.com'></script></head>
<body class='w-[380px] bg-[#080c18] text-white font-sans'>
<div class='p-4'>
<div class='flex justify-between items-center'><h1 class='font-black'>WebGuard AI 2.1</h1><span class='text-[9px] bg-blue-600 px-2 py-1 rounded-full'>8-ENGINE</span></div>
<div id='scoreBox' class='mt-3 bg-[#121a2e] rounded-[20px] p-4 border border-white/5'>
<div class='flex gap-4 items-center'>
<div id='circle' class='w-[72px] h-[72px] rounded-full flex items-center justify-center text-2xl font-black border-[4px]'>--</div>
<div class='flex-1'><div id='verdict' class='font-bold text-[14px]'>Scanning...</div><div id='mainReason' class='text-[11px] opacity-60 mt-1 leading-tight'>Analyzing 8 engines...</div></div>
</div>
<div id='engines' class='grid grid-cols-4 gap-1.5 mt-3'></div>
<div id='reasons' class='mt-3 text-[10px] leading-[1.4] opacity-70 max-h-[90px] overflow-auto'></div>
</div>
<div class='grid grid-cols-2 gap-2 mt-3'>
<label class='bg-[#121a2e] p-2.5 rounded-xl flex justify-between text-[11px]'><span>Risk</span><input type='checkbox' checked disabled></label>
<label class='bg-[#121a2e] p-2.5 rounded-xl flex justify-between text-[11px]'><span>AI Job</span><input type='checkbox' checked disabled></label>
<label class='bg-[#121a2e] p-2.5 rounded-xl flex justify-between text-[11px]'><span>Dark Pat</span><input type='checkbox' checked></label>
<label class='bg-[#121a2e] p-2.5 rounded-xl flex justify-between text-[11px]'><span>Review</span><input type='checkbox' checked></label>
<label class='bg-[#121a2e] p-2.5 rounded-xl flex justify-between text-[11px] border border-red-500/30'><span>Adult Blur</span><input type='checkbox' checked></label>
<label class='bg-[#121a2e] p-2.5 rounded-xl flex justify-between text-[11px] border border-amber-500/30'><span>Betting</span><input type='checkbox' checked></label>
<label class='bg-[#121a2e] p-2.5 rounded-xl flex justify-between text-[11px]'><span>Privacy</span><input type='checkbox' checked></label>
<label class='bg-[#121a2e] p-2.5 rounded-xl flex justify-between text-[11px]'><span>Pay Fraud</span><input type='checkbox' checked></label>
</div>
<div class='flex gap-2 mt-3'>
<button id='rescan' class='flex-1 bg-white text-black py-2.5 rounded-xl text-[12px] font-bold'>Rescan Page</button>
<button id='report' class='flex-1 bg-[#ef4444] py-2.5 rounded-xl text-[12px] font-bold'>Report 1930</button>
</div>
<p class='text-[9px] opacity-40 text-center mt-2'>100% Offline - 8-Engine Shield</p>
</div>
<script src='popup.js'></script>
</body></html>
