    <script>
    // OVERRIDE: Fixed analyze logic for adult search bug
    window.fixedAnalyze = function(url, extra=""){
      const u=url.toLowerCase();
      try{
        const parsed=new URL(u);
        const domain=parsed.hostname.replace("www.","");
        const path=parsed.pathname;
        const urlWoQ=domain+path;
        const searchQ=parsed.searchParams.get("q")||"";
        const isSearch=["google.com","bing.com","duckduckgo.com","yahoo.com","wikipedia.org"].some(s=>domain.includes(s));
        let score=95, reasons=[], flags={adult:false,betting:false};
        const BLOCK=["1xbet","parimatch","stake.com","xvideos","pornhub","onlyfans","xnxx","xhamster","redtube","bet365","onlyfans-leak"];
        const ADULT=["porn","xxx","xvideos","pornhub","onlyfans","xnxx","xhamster","redtube"];
        const BET=["aviator","double money","betting app","casino"];
        for(let d of BLOCK){ if(urlWoQ.includes(d)){ score=12; reasons.push(`Blocklisted: ${d}`); if(["xvideos","pornhub","onlyfans","xnxx","porn","xxx"].some(k=>d.includes(k))) flags.adult=true; else flags.betting=true; break; } }
        if(!flags.adult){ for(let k of ADULT){ if(urlWoQ.includes(k)){ score=Math.min(score,15); flags.adult=true; reasons.push(`Adult: ${k}`); break; } } }
        if(isSearch && searchQ){
          if(["adult","porn","xxx","nude","onlyfans","sex"].some(k=>searchQ.toLowerCase().includes(k))){
            if(!flags.adult){ score=Math.min(score,65); reasons.push(`Search query contains adult: '${searchQ.slice(0,30)}' - Google safe YELLOW`); }
          }
        }
        if(flags.adult||flags.betting) score=Math.min(score,18);
        if(reasons.length==0) reasons.push("Clean - 8 engines");
        const final=Math.max(5,Math.min(98,score));
        const verdict=final<40?"RED":final<70?"YELLOW":"GREEN";
        return {trust:final, verdict, reasons, flags};
      }catch(e){ return {trust:95, verdict:"GREEN", reasons:["Clean"], flags:{adult:false,betting:false}} }
    }
